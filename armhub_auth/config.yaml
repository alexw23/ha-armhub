name: "UK Heat Network (ARM-Hub) — Auth Addon"
description: "Handles Azure AD B2C login and token refresh for the ARM-Hub HA integration."
version: "2.2.1"
slug: "armhubmeter"
init: false

arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386

map:
  - data

homeassistant_api: true

ingress: true
ingress_port: 8099
panel_icon: mdi:fire
panel_title: "ARM-Hub Meter"

options:
  gmail_client_id: ""
  gmail_client_secret: ""
schema:
  gmail_client_id: str?
  gmail_client_secret: password?
