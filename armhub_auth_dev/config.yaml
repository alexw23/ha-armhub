name: "UK Heat Network (ARM-Hub) — Auth Addon (dev)"
description: "Development build of the Auth Addon, tracking main. Pulls the dev image that CI publishes on every push to main. Only run one of the two add-ons at a time."
version: "dev"
slug: "armhubmeter-dev"
url: "https://github.com/alexw23/ha-armhub"
init: false

arch:
  - aarch64
  - amd64

image: "ghcr.io/alexw23/ha-armhub-{arch}"

map:
  - data

homeassistant_api: true

ingress: true
ingress_port: 8099
panel_icon: mdi:fire
panel_title: "ARM-Hub Meter (dev)"

options:
  email_code_source: gmail
  imap_entity: ""
  gmail_client_id: ""
  gmail_client_secret: ""
schema:
  email_code_source: list(gmail|imap|manual)
  imap_entity: str?
  gmail_client_id: str?
  gmail_client_secret: password?
