name: Publish add-on images

on:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Work out the image tags
        id: tags
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.event.release.tag_name }}
          IMAGE: ghcr.io/${{ github.repository }}-${{ matrix.arch }}
        run: |
          if [ "$EVENT" = "release" ]; then
            VERSION="${TAG#v}"
            if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "Release tags need to look like v2.3.0, not $TAG" >&2
              exit 1
            fi
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "tags=$IMAGE:$VERSION,$IMAGE:latest" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev" >> "$GITHUB_OUTPUT"
            echo "tags=$IMAGE:dev" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: armhub_auth
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: BUILD_FROM=ghcr.io/home-assistant/${{ matrix.arch }}-base-debian:bookworm
          labels: |
            io.hass.type=addon
            io.hass.arch=${{ matrix.arch }}
            io.hass.version=${{ steps.tags.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max

  # Last, because the add-on store offers a new version as soon as config.yaml on
  # main says so, and the images for it have to exist by then. This opens a pull
  # request because main is protected and GITHUB_TOKEN can't be given a bypass.
  bump-version:
    if: github.event_name == 'release'
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Set the version and stamp the changelog
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${TAG#v}"
          DATE="$(date -u +%Y-%m-%d)"
          sed -i "s/^version:.*/version: \"$VERSION\"/" armhub_auth/config.yaml
          sed -i "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" custom_components/armhub/manifest.json
          sed -i "0,/^## \[Unreleased\].*/s//## [Unreleased]\n\n## [$VERSION] - $DATE/" CHANGELOG.md
          # Home Assistant doesn't follow symlinks inside add-on folders. The copies
          # users see leave out the heading kept in the main one for the next release.
          sed '/^## \[Unreleased\]$/,+1d' CHANGELOG.md > armhub_auth/CHANGELOG.md
          sed '/^## \[Unreleased\]$/,+1d' CHANGELOG.md > armhub_auth_dev/CHANGELOG.md
      - name: Open the pull request
        env:
          TAG: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="release/$TAG"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add armhub_auth custom_components/armhub/manifest.json CHANGELOG.md armhub_auth_dev
          git commit -m "Release $TAG: set version and stamp changelog"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "Release $TAG: set version and stamp changelog" \
            --body "The images for $TAG are published. Merge this to offer the update in the add-on store."
